<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DG Telugu Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:#060611;
overflow-x:hidden;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:30px;

}

body::before{

content:'';
position:fixed;
width:420px;
height:420px;
background:#7b3cff;
border-radius:50%;
filter:blur(170px);
top:-120px;
left:-150px;
opacity:.45;

}

body::after{

content:'';
position:fixed;
width:420px;
height:420px;
background:#45a4ff;
border-radius:50%;
filter:blur(170px);
right:-150px;
bottom:-120px;
opacity:.45;

}

.card{

position:relative;
width:100%;
max-width:470px;

background:rgba(18,20,38,.82);

border:1px solid rgba(255,255,255,.08);

border-radius:36px;

padding:55px 35px;

text-align:center;

backdrop-filter:blur(22px);

box-shadow:
0 0 0 1px rgba(255,255,255,.03),
0 0 45px rgba(120,80,255,.35);

animation:fade 1s ease;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(25px);

}

to{

opacity:1;
transform:translateY(0);

}

}

.smallTop{

letter-spacing:7px;
font-size:13px;
color:#6ec5ff;
margin-bottom:30px;

}

.logoWrap{

width:190px;
height:190px;
margin:auto;

padding:7px;

border-radius:50%;

background:linear-gradient(135deg,#8f3cff,#59b2ff);

box-shadow:
0 0 18px #8b3dff,
0 0 50px rgba(120,80,255,.65);

animation:float 4s infinite ease-in-out;

}

@keyframes float{

0%{transform:translateY(0px);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0px);}

}

.logo{

width:100%;
height:100%;

border-radius:50%;

overflow:hidden;

background:#111;

}

.logo img{

width:100%;
height:100%;
object-fit:cover;

}

.title{

margin-top:35px;

font-size:62px;

font-weight:800;

line-height:1.05;

background:linear-gradient(#ffffff,#bb9dff);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.line{

width:90px;
height:5px;

margin:24px auto;

border-radius:30px;

background:linear-gradient(90deg,#8c3fff,#5aaeff);

}

.desc{

font-size:19px;

line-height:1.8;

color:#d7d7d7;

margin-bottom:35px;

}

.desc span{

color:#64c5ff;
font-weight:700;.button{

display:block;
width:100%;

padding:20px;

border-radius:18px;

text-decoration:none;

font-size:22px;

font-weight:700;

color:#fff;

background:linear-gradient(90deg,#8f3cff,#4ea8ff);

box-shadow:
0 0 20px rgba(140,70,255,.5),
0 0 40px rgba(70,150,255,.3);

transition:.35s;

}

.button:hover{

transform:translateY(-4px) scale(1.03);

box-shadow:
0 0 35px rgba(140,70,255,.8),
0 0 60px rgba(70,150,255,.6);

}

.note{

margin-top:20px;

font-size:15px;

color:#9b9b9b;

}

.footer{

margin-top:35px;

font-size:13px;

color:#6f6f6f;

}

@media(max-width:480px){

.card{

padding:45px 25px;

}

.logoWrap{

width:165px;
height:165px;

}

.title{

font-size:48px;

}

.desc{

font-size:17px;

}

.button{

font-size:20px;

}

}

</style>

</head>

<body>

<div class="card">

<div class="smallTop">
✦ DG TELUGU HUB ✦
</div>

<div class="logoWrap">

<div class="logo">

<img src="logo.png" alt="DG Logo">

</div>

</div>

<div class="title">
DG<br>
TELUGU<br>
HUB
</div>

<div class="line"></div>

<div class="desc">

Join our <span>Private Telegram Community</span>

<br><br>

🚀 Daily Updates<br>
⚡ Instant Alerts<br>
💬 Telugu Members Only

</div>

<a class="button"
href="https://t.me/+mmDR9n1SDnxkNjJl">

JOIN TELEGRAM →

</a>

<div class="note">

100% Free • Private Channel

</div>

<div class="footer">

Powered by DG Telugu Hub

</div>

</div>

</body>

</html>

}
