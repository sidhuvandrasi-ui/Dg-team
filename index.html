<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DG Telugu Hub</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#070814;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
color:#fff;
}

.card{
width:100%;
max-width:420px;
background:#0d1020;
border:2px solid rgba(132,95,255,.3);
border-radius:30px;
padding:35px 25px;
text-align:center;
box-shadow:0 0 40px rgba(120,80,255,.35);
}

.top{
color:#64b5ff;
font-size:14px;
letter-spacing:6px;
margin-bottom:25px;
}

.logo{
width:150px;
height:150px;
margin:auto;
border-radius:50%;
overflow:hidden;
background:linear-gradient(135deg,#8d3cff,#5ba8ff);
padding:5px;
box-shadow:0 0 35px #7b4dff;
}

.logo img{
width:100%;
height:100%;
border-radius:50%;
object-fit:cover;
}

h1{
font-size:48px;
line-height:1.1;
margin-top:30px;
font-weight:900;
background:linear-gradient(90deg,#ffffff,#b388ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.line{
width:90px;
height:4px;
margin:22px auto;
border-radius:20px;
background:linear-gradient(90deg,#8d3cff,#5ba8ff);
}

p{
color:#d0d0d0;
font-size:18px;
line-height:1.7;
margin-bottom:35px;
}

.highlight{
color:#64b5ff;
font-weight:bold;
}

.btn{
display:block;
text-decoration:none;
background:linear-gradient(90deg,#8d3cff,#6ba8ff);
color:#fff;
font-size:22px;
font-weight:bold;
padding:20px;
border-radius:18px;
box-shadow:0 0 30px rgba(120,80,255,.5);
transition:.3s;
}

.btn:hover{
transform:scale(1.04);
}

.small{
margin-top:18px;
font-size:14px;
color:#8c8c8c;
}
</style>

</head>
<body>

<div class="card">

<div class="top">✦ DG TELUGU HUB ✦</div>

<div class="logo">
<img src="logo.png" alt="DG Logo">
</div>

<h1>DG<br>TELUGU<br>HUB</h1>

<div class="line"></div>

<p>
Join our <span class="highlight">Private Telegram Community</span><br>
Daily Updates • Instant Alerts
</p>

<a class="btn" href="https://t.me/+mmDR9n1SDnxkNjJl">
JOIN TELEGRAM ➜
</a>

<div class="small">
Tap to open Telegram and join instantly
</div>

</div>

</body>
</html>
